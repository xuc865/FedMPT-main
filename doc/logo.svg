<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" viewBox="0 0 640 150">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#38bdf8;#60a5fa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#818cf8;#a78bfa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#60a5fa;#c084fc;#38bdf8" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="150" rx="18" fill="#0f172a"/>
  <rect x="1" y="1" width="638" height="148" rx="17" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="320" y="62" fill="url(#titleGrad)" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="700" text-anchor="middle" filter="url(#glow)">OpenFedML</text>
  <text x="320" y="102" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle">Federated Multi-Label Learning</text>
  <text x="320" y="128" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">Vision-Language Models · CVPR 2026</text>
</svg>
